name: Price Monitor

on:
  schedule:
    # Twice an hour, offset from the top of the hour: GitHub drops queued
    # scheduled jobs under load, and the hour boundary is the worst moment.
    # The old '*/10' asked for 144 runs/day and actually delivered ~12.
    - cron: '13,43 * * * *'
    # Monthly keepalive, on a cron of its own so the keepalive job can tell
    # it apart from the price checks via github.event.schedule.
    - cron: '27 5 1 * *'
  workflow_dispatch:           # allow manual trigger from the Actions tab
    inputs:
      keepalive:
        description: 'Also push an empty keepalive commit (use this to test the keepalive job)'
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write           # required to save cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restore the alert-state file from the previous run.
      # Using run_id in the key ensures a new entry is always written;
      # restore-keys picks up the most recent existing entry.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: price-monitor-state-${{ github.run_id }}
          restore-keys: price-monitor-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price monitor
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python price_monitor.py

      # Always save state so the cooldown persists across runs
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: price-monitor-state-${{ github.run_id }}

  # A public repository has its scheduled workflows disabled automatically
  # after 60 days with no activity, which is what the GitHub warning email is
  # about. Pushing an empty commit once a month keeps the timer far from 60.
  #
  # Caveat: GitHub documents the 60-day rule but never says what counts as
  # "repository activity", and in particular never says whether a commit
  # pushed with GITHUB_TOKEN counts. If it turns out not to, the warning email
  # arrives again and any ordinary push resets the timer by hand.
  #
  # Runs as its own job so a failing price check cannot take the keepalive
  # down with it.
  keepalive:
    if: github.event.schedule == '27 5 1 * *' || github.event.inputs.keepalive == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to push the commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push empty keepalive commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keepalive, reset the 60-day inactivity timer'
          git push
